  /auth/password:
    post:
      summary: Change local password and revoke every session
      operationId: post_auth_password
      security:
      - Session: []
        CSRF: []
      parameters:
      - name: Origin
        in: header
        required: false
        description: Required matching browser origin for cookie mutations, login and bootstrap. Bearer-only API
          requests are exempt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                new_password:
                  type: string
                  writeOnly: true
                  minLength: 12
                  maxLength: 1024
              required:
              - current_password
              - new_password
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: *id001
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/sessions:
