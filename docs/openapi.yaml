                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      summary: Revoke current session and expire cookie
      operationId: post_auth_logout
      security:
      - Session: []
        CSRF: []
      parameters:
      - name: Origin
        in: header
        required: false
        description: Required matching browser origin for cookie mutations, login and bootstrap. Bearer-only API
          requests are exempt.
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: &id001
                    type: boolean
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
