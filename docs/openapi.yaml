        username: {type: string}
        password: {type: string, writeOnly: true, maxLength: 4096, description: Required for creation. Empty on edit reuses the encrypted saved credential.}
        timeout_seconds: {type: integer, minimum: 5, maximum: 30, default: 20}
        schemas: {type: array, items: {type: string}, description: Explicit selected schema names. Nonempty on Save; unsupported schemas rejected.}
        acknowledge_unknown: {type: boolean, default: false}
        grant_current_user: {type: boolean, default: false, description: Explicitly grant current user schema-scoped read and operation rights.}
        grant_prod: {type: boolean, default: false, description: Separate explicit PROD authorization; requires grant_current_user on a PROD target.}
    Connection:
      type: object
      required: [target, account, schemas, timeout_seconds]
      properties:
        target: {$ref: '#/components/schemas/Target'}
        account: {$ref: '#/components/schemas/ExecutionAccount'}
        schemas: {type: array, items: {$ref: '#/components/schemas/Schema'}}
        timeout_seconds: {type: integer}
        profile: {$ref: '#/components/schemas/ConnectionProfile'}
    SchemaCandidate:
      type: object
      required: [name, own, object_count, known_privileges, migration_capability, capability_reason]
      properties:
        name: {type: string}
        own: {type: boolean}
        object_count: {type: integer, description: Count of accessible objects; not necessarily the schema's full object count.}
        known_privileges: {type: array, items: {type: string}}
        migration_capability: {type: string, enum: [potential, unknown, unsupported]}
        capability_reason: {type: string}
    ConnectionDiscovery:
      type: object
      description: Legacy Oracle fields are retained. PostgreSQL adds verified database, session role, server version and TLS/driver evidence; error_code blocks registration even after authentication.
      required: [network_state, authentication_state, actual_user, current_schema, database_service, pdb_name, schema_total, schemas, warnings, capabilities]
      properties:
        network_state: {type: string, enum: [verified, failed, unknown]}
        authentication_state: {type: string, enum: [verified, failed, rejected, unknown]}
        engine: {type: string, enum: [oracle, postgresql]}
        database_name: {type: string}
        session_user: {type: string}
        server_version: {type: string}
        tls_mode: {type: string}
        jdbc_driver: {type: string}
        error_code: {type: string}
        error_message: {type: string}
        actual_user: {type: string}
        current_schema: {type: string}
        database_service: {type: string}
        pdb_name: {type: string}
        own_schema: {type: string}
        schema_total: {type: integer, description: Complete returned count without arbitrary truncation. Warnings explain inaccessible or timed out metadata.}
        schemas: {type: array, items: {$ref: '#/components/schemas/SchemaCandidate'}}
        system_privileges: {type: array, items: {type: string}}
        enabled_roles: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        capabilities:
          type: array
          items:
            type: object
            required: [view, status, detail]
            properties:
              view: {type: string}
              status: {type: string}
              detail: {type: string}
    Target:
      type: object
      description: Legacy Oracle JSON omits additive engine fields to preserve snapshot bytes. Missing engine means Oracle in memory.
      properties:
        engine: {type: string, enum: [oracle, postgresql]}
