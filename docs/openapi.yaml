      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                new_password:
                  type: string
                  writeOnly: true
                  minLength: 12
                  maxLength: 1024
              required:
              - current_password
              - new_password
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: *id001
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
