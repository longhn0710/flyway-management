  /projects/{id}:
    delete:
      summary: 'Admin: delete an empty project after exact name confirmation'
      operationId: delete_project
      description: Deletes only project metadata and atomically records project.delete audit evidence.
        Rejects any remaining membership with 409, including inactive resources and archived projects.
        Archived membership must be cleared through the existing unarchive/edit workflow.
        Instances, schemas, accounts, artifacts, migration history and prior audits are preserved.
        Confirmation and membership are rechecked in the write transaction. Missing or already-deleted projects return 404.
      security:
      - Session: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation_name]
              properties:
                confirmation_name:
                  type: string
                  maxLength: 120
                  description: Exact current project name; comparison is case-sensitive and does not trim whitespace.
      responses:
        '200':
          description: Project deleted; no other resource deleted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted:
                        type: boolean
                        const: true
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: Read a visible project
      operationId: get_project
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: 'Admin: edit/archive/restore project; membership is read-only while archived'
      operationId: update_project
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
  /projects/{id}/migration-runs:
    get:
      summary: Run history under current membership and run RBAC, globally paginated; no historical project attribution
      operationId: project_migration_runs
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: target_id
        in: query
        required: false
        schema:
          type: string
      - name: schema_id
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: actor
        in: query
        required: false
        schema:
          type: string
      - name: source
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 0
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/Error'
  /database-targets/{id}/schemas/{schemaID}/flyway-info:
    get:
      summary: Latest recorded native Info, or null; optional run selector is historical
      operationId: get_flyway_info
      parameters:
      - &projects_id001
        name: id
        in: path
        required: true
        schema:
          type: string
      - &projects_id002
        name: schemaID
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: query
        required: false
        schema:
          type: string
      responses:
