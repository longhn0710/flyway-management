components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: fm_session
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: opaque fm_ token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
          required:
          - code
          - message
      required:
      - error
    Grant:
      type: object
      properties:
        target_id:
          type: string
        schema_id:
          type: string
          description: Empty string grants all schemas in this target.
        read: *id001
        operate: *id001
        prod: *id001
      required:
      - target_id
      - schema_id
      - read
      - operate
      - prod
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        provider:
          type: string
          enum:
          - local
          - ldap
          - oidc
        issuer:
          type: string
        subject:
          type: string
        role:
          type: string
          enum:
          - Admin
          - Operator
          - Viewer
        active: *id001
        created_at: &id006
          type: string
          format: date-time
    UserInput:
      type: object
      properties:
        username:
          type: string
          maxLength: 128
        display_name:
          type: string
          maxLength: 200
        provider:
          type: string
          enum:
          - local
          - ldap
          - oidc
          default: local
        issuer:
          type: string
          maxLength: 512
        subject:
          type: string
          maxLength: 512
        role:
          type: string
          enum:
          - Admin
          - Operator
          - Viewer
          default: Viewer
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
      required:
      - username
    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
        role:
          type: string
          enum:
          - Admin
          - Operator
          - Viewer
        active: *id001
      required:
      - display_name
      - role
      - active
    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        csrf_token:
          type: string
          description: Send as X-CSRF-Token on cookie-authenticated mutations.
        expires_at: *id006
    SessionInfo:
      type: object
      properties:
        id:
          type: string
        created_at: *id006
        expires_at: *id006
        current: *id001
    AuthStatus:
      type: object
      properties:
        bootstrap_required: *id001
        providers:
          type: array
          items:
            type: string
            enum:
            - local
            - ldap
            - oidc
        bootstrap_token_file:
          type: string
          description: Private server-side file path, present only before bootstrap; never its contents.
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        schema_version: &id014
          type: integer
        installation_id:
          type: string
        capabilities:
          type: object
          properties:
            authentication: *id001
            registry: *id001
            migration_execution:
              const: false
    Target:
      type: object
      properties:
        id: &id007
          type: string
        name: &id008
          type: string
        environment: &id009
          type: string
          enum:
          - DEV
          - UAT
          - PROD
        host: &id010
          type: string
        port: &id011
          type: integer
          minimum: 1
          maximum: 65535
        service: &id012
          type: string
        transport: &id013
          type: string
          enum:
          - TCP
          - TCPS
        active: *id001
        created_at: *id006
    TargetInput:
      type: object
      properties:
        id: *id007
        name: *id008
        environment: *id009
        host: *id010
        port: *id011
        service: *id012
        transport: *id013
        active: *id001
      required:
      - name
      - environment
      - host
      - port
      - service
      - transport
    Schema:
      type: object
      properties:
        id:
          type: string
        target_id:
          type: string
        name:
          type: string
        history_schema:
          type: string
        history_table:
          type: string
        default_account_id:
          type: string
        active: *id001
        created_at: *id006
    SchemaInput:
      type: object
      properties:
        name:
          type: string
        history_schema:
          type: string
          description: Defaults to target schema name.
        history_table:
          type: string
          default: flyway_schema_history
        default_account_id:
          type: string
          description: Empty clears the default; nonempty must be explicitly mapped and active.
        active: *id001
      required:
      - name
    CredentialMetadata:
      type: object
      properties:
        configured: *id001
        version: *id014
        updated_at: &id015
          anyOf:
          - *id006
          - const: ''
        revoked: *id001
    ExecutionAccount:
      type: object
      properties:
        id:
          type: string
        target_id:
          type: string
        name:
          type: string
        username:
          type: string
        active: *id001
        schema_ids:
          type: array
          items:
            type: string
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        created_at: *id006
    AccountInput:
      type: object
      properties:
        target_id:
          type: string
        name:
          type: string
        username:
          type: string
        active: *id001
        schema_ids:
          type: array
          items:
            type: string
        password:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Optional on creation; use credential endpoint for replacement.
      required:
      - name
      - username
      - schema_ids
    ServiceAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        owner_id:
          type: string
        purpose:
          type: string
        active: *id001
        created_at: *id006
    ServiceInput:
      type: object
      properties:
        name:
          type: string
        owner_id:
          type: string
        purpose:
          type: string
        active: *id001
      required:
      - name
      - owner_id
      - purpose
    Token:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        created_at: *id006
        expires_at: *id006
        last_used_at: *id015
        revoked: *id001
    TokenInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        expires_at: *id006
      required:
      - expires_at
    IssuedToken:
      type: object
      properties:
        token:
          type: string
          description: One-time plaintext; cannot be retrieved again.
        metadata:
          $ref: '#/components/schemas/Token'
    LDAPSettings:
      type: object
      properties:
        enabled: *id001
        url:
          type: string
        start_tls: *id001
        base_dn:
          type: string
        bind_dn_template:
          type: string
          description: Contains {username}; escaped before direct user bind.
        subject_attribute:
          type: string
        username_attribute:
          type: string
          default: uid
        display_name_attribute:
          type: string
          default: displayName
        ca_file:
          type: string
    OIDCSettings:
      type: object
      properties:
        enabled: *id001
        issuer: &id016
          type: string
        client_id: &id017
          type: string
        redirect_url: &id018
          type: string
        ca_file: &id019
          type: string
        client_secret_configured: *id001
    OIDCInput:
      type: object
      properties:
        enabled: *id001
        issuer: *id016
        client_id: *id017
        redirect_url: *id018
        ca_file: *id019
        client_secret_configured: *id001
        client_secret:
          type: string
          writeOnly: true
          description: Empty/omitted preserves the existing encrypted secret.
    AuthSettings:
      type: object
      properties:
        local_enabled: *id001
        ldap:
          $ref: '#/components/schemas/LDAPSettings'
        oidc:
          $ref: '#/components/schemas/OIDCSettings'
    AuthSettingsInput:
      type: object
      properties:
        local_enabled: *id001
        ldap:
          $ref: '#/components/schemas/LDAPSettings'
        oidc:
          $ref: '#/components/schemas/OIDCInput'
      required:
      - local_enabled
      - ldap
      - oidc
    AuditEvent:
      type: object
      properties:
        id: *id014
        actor_id:
          type: string
        actor_type:
          type: string
        actor_name:
          type: string
        action:
          type: string
        target:
          type: string
        timestamp: *id006
        outcome:
          type: string
        request_id:
          type: string
  responses:
    Error:
      description: Typed API error with safe message and optional field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
