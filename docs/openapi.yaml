        target_id: {type: string}
        schema_id: {type: string}
        execution_account_id: {type: string}
        artifact_id: {type: string}
        context: {$ref: '#/components/schemas/RunContext'}
        target: {$ref: '#/components/schemas/Target'}
        schema: {$ref: '#/components/schemas/Schema'}
        account: {$ref: '#/components/schemas/AccountSnapshot'}
        actor_id: {type: string}
        actor_kind: {type: string}
        actor_name: {type: string}
        source: {type: string, enum: [WEB, API]}
