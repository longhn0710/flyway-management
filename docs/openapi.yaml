  /artifacts:
    post:
      summary: Upload and normalize an immutable SQL migration bundle
      operationId: post_artifacts
      description: >-
        Multipart file parts are repeated under `files`. Preserve each selected file's original filename, including
        folder-relative path segments. Total request size is limited to 50 MiB plus 64 KiB multipart overhead;
        configurable extraction, file-count, per-file, path, and expansion-ratio limits also apply. Archive type is
        detected from content. Original bytes and normalized SQL are stored in SQLite.
      security:
      - Session: []
        CSRF: []
      - Bearer: []
      parameters:
      - name: target_id
        in: query
        required: true
        schema: {type: string}
      - name: schema_id
        in: query
        required: true
        schema: {type: string}
      - name: Origin
        in: header
        required: false
        description: Browser cookie mutations require a matching same-site Origin. Bearer requests are exempt.
        schema: {type: string}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
              required: [files]
            encoding:
              files:
                contentType: application/octet-stream

      responses:
        '201':
          description: Bundle accepted and normalized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Artifact'}
                required: [data]
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
