        default:
          $ref: '#/components/responses/Error'
  /database-targets/{id}/schemas/{schemaID}/flyway-info/refresh:
    post:
      summary: 'Operate: native read-only info only, pinned runtime, mapped account, immutable files, stream holds,
        bounded time/output; failures return partial evidence'
      operationId: refresh_flyway_info
      parameters:
      - *projects_id001
      - *projects_id002
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/InfoCapture'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunInput'
components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: fm_session
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: opaque fm_ token
  schemas:
    OracleCorrectionReviewInput:
      type: object
      additionalProperties: false
      required: [failed_run_id, artifact_id, deployment_target_revision]
      properties:
        failed_run_id: {type: string}
        artifact_id: {type: string}
        deployment_target_revision: {type: integer, minimum: 1}
    OracleCorrectionApprovalInput:
      type: object
      additionalProperties: false
      required: [preflight_id, input_sha256, partial_ddl_reviewed, note]
      properties:
        preflight_id: {type: string}
        input_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        partial_ddl_reviewed: {type: boolean, const: true}
        note: {type: string, minLength: 1, maxLength: 2000}
    OracleCorrectionReview:
      type: object
      required: [id, project_id, deployment_target_id, deployment_target_revision, artifact_id, correction_of_run_id, review_only, ready, live_status, blockers, assessment, oracle_evidence, created_at, expires_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        deployment_target_id: {type: string}
        deployment_target_revision: {type: integer}
        artifact_id: {type: string}
        correction_of_run_id: {type: string}
        review_only: {type: boolean, const: true}
        ready: {type: boolean}
        live_status: {type: string, enum: [VERIFIED, NOT_VERIFIED]}
        blockers: {type: array, items: {$ref: '#/components/schemas/Blocker'}}
        assessment: {$ref: '#/components/schemas/Preflight'}
        oracle_evidence: {$ref: '#/components/schemas/OracleCorrectionEvidence'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    OracleCorrectionEvidence:
      type: object
      required: [dbid, database_unique_name, pdb_name, service, session_user, current_schema, objects_sha256, history]
      properties:
        dbid: {type: string}
        database_unique_name: {type: string}
        pdb_name: {type: string}
        service: {type: string}
        session_user: {type: string}
        current_schema: {type: string}
        objects_sha256: {type: string}
        history:
          type: array
          items:
            type: object
            required: [rank, version, description, type, script, checksum, installed_by, installed_on, execution_time, success]
            properties:
              rank: {type: integer}
              version: {type: string}
              description: {type: string}
              type: {type: string}
              script: {type: string}
              checksum: {type: [integer, 'null']}
              installed_by: {type: string}
              installed_on: {type: string}
              execution_time: {type: integer}
              success: {type: boolean}
    OracleCorrectionApproval:
      type: object
      required: [id, failed_run_id, input_sha256, approved_by, expires_at, stream_held, single_use]
      properties:
        id: {type: string}
        failed_run_id: {type: string}
        input_sha256: {type: string}
        approved_by: {type: string}
        expires_at: {type: string, format: date-time}
        stream_held: {type: boolean, const: true}
        single_use: {type: boolean, const: true}

    ExternalProject:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
          - active
          - archived
        members:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ProjectMember'
        id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - status
      - created_at
      - updated_at
      - members
    ExternalDeploymentTargetInput:
      type: object
      additionalProperties: false
      required:
      - name
      - target_id
      - schema_id
      - execution_account_id
      - environment
      - active
      properties:
        name: &v2schemaid001
          type: string
          minLength: 1
          maxLength: 100
        target_id: &v2schemaid002
          type: string
        schema_id: &v2schemaid003
          type: string
        execution_account_id: &v2schemaid004
          type: string
        environment: &v2schemaid005
          type: string
          enum:
          - DEV
          - SIT
          - UAT
          - PROD
        active: &v2schemaid006
          type: boolean
        revision: &v2schemaid007
          type: integer
          minimum: 0
    ExternalDeploymentGrantInput:
      type: object
      additionalProperties: false
      required:
      - principal_kind
      - principal_id
      - read
      - upload
      - preflight
      - execute
      properties:
        principal_kind:
          type: string
          enum:
          - user
          - service
        principal_id:
          type: string
        read:
          type: boolean
        upload:
          type: boolean
        preflight:
          type: boolean
        execute:
          type: boolean
    ExternalTokenDeploymentScope:
      type: object
      additionalProperties: false
      required:
      - deployment_target_id
      - read
      - upload
      - preflight
      - execute
      properties:
        deployment_target_id:
          type: string
        read:
          type: boolean
        upload:
          type: boolean
        preflight:
          type: boolean
        execute:
          type: boolean
    ExternalRunInput:
      type: object
      additionalProperties: false
      required:
      - artifact_id
      - deployment_target_revision
      properties:
        artifact_id:
          type: string
        preflight_id:
          type: string
        deployment_target_revision:
          type: integer
          minimum: 1
        external_source:
          $ref: '#/components/schemas/ExternalSource'
    ExternalProblem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        field:
          type: string
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
    ExternalSource:
      type: object
      additionalProperties: false
      properties:
        system:
          type: string
        execution_id:
          type: string
        execution_url:
          type: string
        workflow:
          type: string
        repository_url:
          type: string
        revision:
          type: string
      description: Optional caller-reported provenance, at most 4096 UTF-8 bytes encoded as JSON. Authenticated actor is recorded
        separately. URL fields are descriptive text.
    ExternalPage:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
        next_cursor:
          type: string
          description: Opaque cursor bound to caller and resource. Omitted on the last page. Restart invalidates cursors; start
            collection again.
      required:
      - limit
    ExternalDeploymentTarget:
      type: object
      properties:
        name: *v2schemaid001
        target_id: *v2schemaid002
        schema_id: *v2schemaid003
        execution_account_id: *v2schemaid004
        environment: *v2schemaid005
        active: *v2schemaid006
        revision: *v2schemaid007
        id:
          type: string
        project_id:
          type: string
        database_name:
          type: string
        schema_name:
          type: string
        account_name:
          type: string
        can_read:
          type: boolean
        can_upload:
          type: boolean
        can_preflight:
          type: boolean
        can_execute:
          type: boolean
      required:
      - id
      - project_id
      - name
      - environment
      - target_id
      - schema_id
      - execution_account_id
      - active
      - revision
      - database_name
      - schema_name
      - account_name
      - can_read
      - can_upload
      - can_preflight
      - can_execute
    ExternalArtifact:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        deployment_target_id:
          type: string
        deployment_target_revision:
          type: integer
        input_sha256:
          type: string
          description: Verified SHA-256 of the original ZIP bytes.
        sha256:
          type: string
          description: Existing normalized SQL inventory digest.
        files:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactFile'
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactInput'
        total_bytes:
          type: integer
        created_at:
          $ref: '#/components/schemas/DateTime'
        external_source:
          $ref: '#/components/schemas/ExternalSource'
        uploader_id:
          type: string
        uploader_kind:
          type: string
        uploader_name:
          type: string
      required:
      - id
      - project_id
      - deployment_target_id
      - deployment_target_revision
      - input_sha256
      - sha256
      - files
      - inputs
      - total_bytes
      - created_at
      - external_source
      - uploader_id
      - uploader_kind
      - uploader_name
    ExternalPreflight:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        deployment_target_id:
          type: string
        deployment_target_revision:
          type: integer
        artifact_id:
          type: string
        destination:
          $ref: '#/components/schemas/ExternalDeploymentTarget'
        created_at:
          $ref: '#/components/schemas/DateTime'
        expires_at:
          $ref: '#/components/schemas/DateTime'
        ready:
          type: boolean
        live_status:
          type: string
        blockers:
