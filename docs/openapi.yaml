      properties:
        auth_kind: {type: string, enum: [password]}
        tls_mode: {type: string, enum: [verify-full]}
        ca_pem: {type: string, maxLength: 65536, description: Admin-approved PEM CA certificates only. No paths or private keys. Returned only by administrative connection APIs.}
        ca_sha256: {type: string, readOnly: true, description: Computed from exact CA content by the server.}
        revision: {type: integer, readOnly: true}
    ConnectionInput:
      type: object
      additionalProperties: false
      required: [target, username]
      properties:
        target: {$ref: '#/components/schemas/TargetInput'}
