openapi: 3.1.0
info:
  title: Flyway Manager API
  version: 0.7.0
  description: Standalone identity, engine-aware registry, immutable artifacts and controlled asynchronous Flyway execution. V1 JSON successes use {data:...}; errors use {error:{code,message,field?}}. Project-centric v2 routes use RFC9457 problem responses and project/deployment scopes; execution records are raw immutable JSON.
    JSON mutation bodies are limited to 1 MiB and unknown fields are rejected. Browser mutations require same Origin
    plus per-session CSRF, except first-run/login require Origin plus their credentials. Bearer tokens never create
    web sessions and cannot access administration. Lists with limit/offset are filtered by authorization before
    pagination; ordering is stable. Clock values are UTC RFC3339. Sessions expire after 12 hours or 30 minutes idle;
    account/role changes and password changes revoke sessions. Unknown routes return JSON 404; unsupported methods
    405.
servers:
- url: /api/v1
security:
- Session: []
- Bearer: []
paths:
  /health:
    get:
      summary: Public SQLite health and explicit capability flags
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
  /api/v2/projects:
    servers:
    - url: /
    get:
      operationId: external_list_projects
      summary: List projects visible to the authenticated principal
      responses:
        '200':
          description: Project collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalProject'
                  page:
                    $ref: '#/components/schemas/ExternalPage'
                required:
                - data
                - page
        default:
          $ref: '#/components/responses/ExternalProblem'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
  /api/v2/projects/{projectID}:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: external_get_project
      summary: Get a project
      responses:
        '200':
          description: Project returned in data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalProject'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/deployment-targets:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: external_list_deployment_targets
      responses:
        '200':
          description: Deployment targets returned in data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalDeploymentTarget'
                  page:
                    $ref: '#/components/schemas/ExternalPage'
                required:
                - data
                - page
        default:
          $ref: '#/components/responses/ExternalProblem'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: external_create_deployment_target
      security:
      - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalDeploymentTargetInput'
      responses:
        '201':
          description: Created target.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalDeploymentTarget'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/deployment-targets/{deploymentTargetID}:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: deploymentTargetID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: external_get_deployment_target
      responses:
        '200':
          description: Deployment target returned in data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalDeploymentTarget'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
    patch:
      operationId: external_update_deployment_target
      security:
      - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalDeploymentTargetInput'
      responses:
        '200':
          description: Updated target.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalDeploymentTarget'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Quoted current revision, such as "1". Body revision and immutable destination must also match.
  /api/v2/projects/{projectID}/deployment-targets/{deploymentTargetID}/grants:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: deploymentTargetID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: external_list_deployment_target_grants
      security:
      - Session: []
      responses:
        '200':
          description: Configured principal grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalDeploymentGrantInput'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
    put:
      operationId: external_set_deployment_target_grant
      security:
      - Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalDeploymentGrantInput'
      responses:
        '200':
          description: Grant updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ok'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/deployment-targets/{deploymentTargetID}/artifacts:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: deploymentTargetID
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: external_upload_artifact
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              - deployment_target_revision
              - input_sha256
              properties:
                files:
                  type: string
                  format: binary
                  description: Exactly one ZIP archive.
                deployment_target_revision:
                  type: integer
                  minimum: 1
                input_sha256:
                  type: string
                  pattern: ^[0-9a-fA-F]{64}$
                external_source:
                  type: string
                  description: Optional JSON object of reported CI provenance.
      responses:
        '201':
          description: Immutable project-bound artifact.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalArtifact'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/artifacts/{artifactID}:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: artifactID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: external_get_artifact
      responses:
        '200':
          description: Artifact metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalArtifact'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/deployment-targets/{deploymentTargetID}/correction-reviews:
    servers: [{url: /}]
    parameters:
    - {name: projectID, in: path, required: true, schema: {type: string}}
    - {name: deploymentTargetID, in: path, required: true, schema: {type: string}}
    post:
      operationId: review_oracle_correction
      summary: Human DBA correction reviews after verified automatic Oracle Repair
      description: Requires an active human Admin or Operator with current Project and database execution authority. Service tokens cannot review or approve. No SQL, Repair, or hold release is performed by this endpoint. Bounded to 50 seconds for the complete operation. HTTP 504 REQUEST_TIMEOUT or 408 REQUEST_CANCELLED never grants approval; HTTP 409 ORACLE_EVIDENCE_UNAVAILABLE identifies unavailable or unverifiable Oracle identity/history evidence; HTTP 500 AUDIT_FAILURE fails closed if mandatory audit cannot be persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OracleCorrectionReviewInput'}
      responses:
        '200':
          description: Immutable correction evidence or single-use approval; stream remains held.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/OracleCorrectionReview'}
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/deployment-targets/{deploymentTargetID}/correction-approvals:
    servers: [{url: /}]
    parameters:
    - {name: projectID, in: path, required: true, schema: {type: string}}
    - {name: deploymentTargetID, in: path, required: true, schema: {type: string}}
    post:
      operationId: approve_oracle_correction
      summary: Human DBA correction approvals after verified automatic Oracle Repair
      description: Requires an active human Admin or Operator with current Project and database execution authority. Service tokens cannot review or approve. No SQL, Repair, or hold release is performed by this endpoint. Bounded to 50 seconds for the complete operation. HTTP 504 REQUEST_TIMEOUT or 408 REQUEST_CANCELLED never grants approval; HTTP 409 ORACLE_EVIDENCE_UNAVAILABLE identifies unavailable or unverifiable Oracle identity/history evidence; HTTP 500 AUDIT_FAILURE fails closed if mandatory audit cannot be persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OracleCorrectionApprovalInput'}
      responses:
        '201':
          description: Immutable correction evidence or single-use approval; stream remains held.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/OracleCorrectionApproval'}
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/deployment-targets/{deploymentTargetID}/preflights:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: deploymentTargetID
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: external_preflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalRunInput'
      responses:
        '200':
          description: Readiness assessment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalPreflight'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/preflights/{preflightID}:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: preflightID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: external_get_preflight
      responses:
        '200':
          description: Persisted preflight assessment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalPreflight'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/deployment-targets/{deploymentTargetID}/migration-runs:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: deploymentTargetID
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: external_submit_migration_run
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSubmitInput'
      responses:
        '202':
          description: Run accepted for asynchronous processing.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalRun'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/migration-runs:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: cursor
      in: query
      schema:
        type: string
    get:
      operationId: external_list_migration_runs
      responses:
        '200':
          description: Paginated project run history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalRun'
                  page:
                    $ref: '#/components/schemas/ExternalPage'
                required:
                - data
                - page
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/migration-runs/{runID}:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: runID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: external_get_migration_run
      responses:
        '200':
          description: Run state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExternalRun'
                required:
                - data
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/migration-runs/{runID}/logs:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: runID
      in: path
      required: true
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: cursor
      in: query
      schema:
        type: string
    get:
      operationId: external_get_run_logs
      responses:
        '200':
          description: Paginated execution logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunLog'
                  page:
                    $ref: '#/components/schemas/ExternalPage'
                required:
                - data
                - page
        default:
          $ref: '#/components/responses/ExternalProblem'
  /api/v2/projects/{projectID}/migration-runs/{runID}/record:
    servers:
    - url: /
    parameters:
    - name: projectID
      in: path
      required: true
      schema:
        type: string
    - name: runID
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: external_get_immutable_execution_record
      responses:
        '200':
          description: Immutable JSON execution record with ETag.
          headers:
            ETag:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalExecutionRecord'
        default:
          $ref: '#/components/responses/ExternalProblem'
  /auth/status:
    get:
      summary: Enabled providers and one-time setup status
      operationId: get_auth_status
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthStatus'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
  /auth/bootstrap:
    post:
      summary: Create initial local Admin and session atomically
      operationId: post_auth_bootstrap
      description: Requires the private bootstrap.token file contents. Concurrent/repeated successful setup is prevented
        transactionally.
      security: []
      parameters:
      - name: Origin
        in: header
        required: false
        description: Required matching browser origin for cookie mutations, login and bootstrap. Bearer-only API
          requests are exempt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                display_name:
                  type: string
                password:
                  type: string
                  minLength: 12
                  maxLength: 1024
                  writeOnly: true
                setup_token:
                  type: string
                  writeOnly: true
              required:
              - username
              - password
              - setup_token
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      summary: Authenticate explicitly with Local or LDAP
      operationId: post_auth_login
      description: Generic invalid-credential errors. No provider fallback. Sets HttpOnly SameSite=Lax fm_session
        cookie, Secure on HTTPS/configured HTTPS public URL. Rate limited by address and username.
      security: []
      parameters:
      - name: Origin
        in: header
        required: false
        description: Required matching browser origin for cookie mutations, login and bootstrap. Bearer-only API
          requests are exempt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                  - local
                  - ldap
                username:
                  type: string
                password:
                  type: string
                  writeOnly: true
              required:
              - provider
              - username
              - password
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/oidc/start:
    get:
      summary: Begin browser-bound OIDC code flow with PKCE
      operationId: get_auth_oidc_start
      security: []
      responses:
        '302':
          description: Success.
          headers:
            Location:
              schema:
                type: string
              description: Provider authorization URL or same-site /runs after success.
        default:
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/oidc/callback:
    get:
      summary: Consume single-use state and verify OIDC callback
      operationId: get_auth_oidc_callback
      security: []
      responses:
        '302':
          description: Success.
          headers:
            Location:
              schema:
                type: string
              description: Provider authorization URL or same-site /runs after success.
        default:
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters:
      - name: state
        in: query
        schema:
          type: string
      - name: code
        in: query
        schema:
          type: string
      - name: error
        in: query
        schema:
          type: string
  /auth/me:
    get:
      summary: Restore current server-side identity and CSRF token
      operationId: get_auth_me
      security:
      - Session: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      summary: Revoke current session and expire cookie
      operationId: post_auth_logout
      security:
      - Session: []
        CSRF: []
      parameters:
      - name: Origin
        in: header
        required: false
        description: Required matching browser origin for cookie mutations, login and bootstrap. Bearer-only API
          requests are exempt.
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: &id001
                    type: boolean
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/password:
    post:
      summary: Change local password and revoke every session
      operationId: post_auth_password
      security:
      - Session: []
        CSRF: []
      parameters:
      - name: Origin
        in: header
        required: false
        description: Required matching browser origin for cookie mutations, login and bootstrap. Bearer-only API
          requests are exempt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  writeOnly: true
                  maxLength: 1024
                new_password:
                  type: string
                  writeOnly: true
                  minLength: 12
                  maxLength: 1024
              required:
              - current_password
              - new_password
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: *id001
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/sessions:
    get:
      summary: List current user active sessions
      operationId: get_auth_sessions
      security:
      - Session: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionInfo'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '401':
