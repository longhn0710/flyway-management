        '403':
          $ref: '#/components/responses/Error'
    put:
      summary: Update or deactivate Oracle target
      operationId: put_database_targets_id
      description: Supply the complete editable representation including active. Stable IDs cannot move. Successful
        changes and audit commit together.
      security:
      - Session: []
        CSRF: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Origin
        in: header
        required: false
        description: Required matching browser origin for cookie mutations, login and bootstrap. Bearer-only API
