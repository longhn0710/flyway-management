        in: query
        description: Inclusive RFC3339 creation time.
        schema: {type: string, format: date-time}
      - name: q
        in: query
        schema: {type: string}
      responses:
        '200':
          description: Authorized results are filtered before stable pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Run'}
                required: [data]
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Queue a migration run
      operationId: post_migration_runs
      description: Persists the run before dispatch. Repeating the same Idempotency-Key and canonical request returns the original run; reusing the key for a different request conflicts. Failed SQL is never automatically retried.
      security:
      - Session: []
        CSRF: []
      - Bearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 200}
      - name: Origin
        in: header
        required: false
        description: Browser cookie mutations require a matching same-site Origin. Bearer requests are exempt.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunInput'}
      responses:
        '202':
          description: Durable run accepted for asynchronous processing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Run'}
                required: [data]
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /migration-runs/{id}:
    get:
      summary: Read a migration run and its frozen snapshot
      operationId: get_migration_runs_id
      security:
      - Session: []
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Run state is independent of HTTP success and may be FAILED or BLOCKED.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Run'}
                required: [data]
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /migration-runs/{id}/cancel:
    post:
      summary: Cancel a run that is still queued
      operationId: post_migration_runs_id_cancel
      description: Cancellation succeeds only before execution starts. Running or terminal jobs cannot be cancelled or replayed.
      security:
      - Session: []
        CSRF: []
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: Origin
        in: header
        required: false
        description: Browser cookie mutations require a matching same-site Origin. Bearer requests are exempt.
        schema: {type: string}
      responses:
        '200':
          description: Run was cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Ok'}
                required: [data]
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /migration-runs/{id}/logs:
    get:
      summary: Read searchable, paginated execution logs
      operationId: get_migration_runs_id_logs
      security:
      - Session: []
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      - name: q
        in: query
        schema: {type: string}
      - name: channel
        in: query
        schema: {type: string}
      responses:
        '200':
          description: Log lines ordered by sequence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RunLog'}
                required: [data]
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /migration-runs/{id}/artifacts:
    get:
      summary: Read immutable artifact manifests associated with a run
      operationId: get_migration_runs_id_artifacts
      security:
      - Session: []
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Artifact manifests; content is downloaded through separately authorized artifact routes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Artifact'}
                required: [data]
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /migration-runs/{id}/executions:
    get:
      summary: Read bounded Flyway process execution evidence
      operationId: get_migration_runs_id_executions
      security:
      - Session: []
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Flyway command, outcome, bounded output and timestamps.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RunExecution'}
                required: [data]
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /migration-runs/{id}/repair:
    get:
      summary: Read conditional repair evidence independently of migration outcome
      operationId: get_migration_runs_id_repair
      security:
      - Session: []
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Repair status, reason, before/after history and execution reference.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Repair'}
                required: [data]
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /migration-runs/{id}/record:
    get:
      summary: Download a complete JSON run record
      operationId: get_migration_runs_id_record
      security:
      - Session: []
      - Bearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Downloadable JSON envelope with run, logs, process executions, artifacts and repair evidence.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/RunRecord'}
                required: [data]
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /connections/test:
    post:
      summary: Test a transient Oracle connection and discover every visible schema
      operationId: test_connection
      description: Admin browser session required. Metadata never verifies arbitrary migration DDL. Save independently repeats discovery. Each account has an independent allowlist. Existing history and other accounts are retained when mappings are removed.
      security:
      - Session: []
        CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
      responses:
        '200':
          description: Success. Connection diagnostics include sanitized error states; test never persists credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ConnectionDiscovery'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /connections:
    post:
      summary: Atomically register Oracle target, encrypted account, selected schemas and allowlist
      operationId: create_connection
      description: Admin browser session required. Metadata never verifies arbitrary migration DDL. Save independently repeats discovery. Each account has an independent allowlist. Existing history and other accounts are retained when mappings are removed.
      security:
      - Session: []
        CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
      responses:
        '201':
          description: Success. Connection diagnostics include sanitized error states; test never persists credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Connection'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /connections/{id}/test:
    post:
      summary: Test supplied or saved encrypted credentials without changing registry
      operationId: test_saved_connection
      description: Admin browser session required. Metadata never verifies arbitrary migration DDL. Save independently repeats discovery. Each account has an independent allowlist. Existing history and other accounts are retained when mappings are removed.
      security:
      - Session: []
        CSRF: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
      responses:
        '200':
          description: Success. Connection diagnostics include sanitized error states; test never persists credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ConnectionDiscovery'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /connections/{id}:
    get:
      summary: Read wizard configuration and credential metadata
      operationId: get_connection
      description: Admin browser session required. Metadata never verifies arbitrary migration DDL. Save independently repeats discovery. Each account has an independent allowlist. Existing history and other accounts are retained when mappings are removed.
      security:
      - Session: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: account_id
        in: query
        required: false
        description: Inspect this execution account on the target; defaults to the last wizard-edited account.
        schema: {type: string}
      responses:
        '200':
          description: Success. Connection diagnostics include sanitized error states; test never persists credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Connection'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Atomically edit mappings or rotate credentials after fresh Oracle discovery
      operationId: save_connection
      description: Admin browser session required. Metadata never verifies arbitrary migration DDL. Save independently repeats discovery. Each account has an independent allowlist. Existing history and other accounts are retained when mappings are removed.
      security:
      - Session: []
        CSRF: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
      responses:
        '200':
          description: Success. Connection diagnostics include sanitized error states; test never persists credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Connection'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /migration-connections:
    get:
      summary: List usable connections filtered by current operational RBAC and schema allowlist
      operationId: get_migration_connections
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Success. Connection diagnostics include sanitized error states; test never persists credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Target'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /migration-connections/{id}/schemas:
    get:
      summary: List allowed active schemas with mapped credentials for the operator
      operationId: get_migration_schemas
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Success. Connection diagnostics include sanitized error states; test never persists credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Schema'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: fm_session
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: opaque fm_ token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
          required:
          - code
          - message
      required:
      - error
    Grant:
      type: object
      properties:
        target_id:
          type: string
        schema_id:
          type: string
          description: Empty string grants all schemas in this target.
        read: *id001
        operate: *id001
        prod: *id001
      required:
      - target_id
      - schema_id
      - read
      - operate
      - prod
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        provider:
          type: string
          enum:
          - local
          - ldap
          - oidc
        issuer:
          type: string
        subject:
          type: string
        role:
          type: string
          enum:
          - Admin
          - Operator
          - Viewer
        active: *id001
        created_at: &id006
          type: string
          format: date-time
    UserInput:
      type: object
      properties:
        username:
          type: string
          maxLength: 128
        display_name:
          type: string
          maxLength: 200
        provider:
          type: string
          enum:
          - local
          - ldap
          - oidc
          default: local
        issuer:
          type: string
          maxLength: 512
        subject:
          type: string
          maxLength: 512
        role:
          type: string
          enum:
          - Admin
          - Operator
          - Viewer
          default: Viewer
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
      required:
      - username
    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
        role:
          type: string
          enum:
          - Admin
          - Operator
          - Viewer
        active: *id001
      required:
      - display_name
      - role
      - active
    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        csrf_token:
          type: string
          description: Send as X-CSRF-Token on cookie-authenticated mutations.
        expires_at: *id006
    SessionInfo:
      type: object
      properties:
        id:
          type: string
        created_at: *id006
        expires_at: *id006
        current: *id001
    AuthStatus:
      type: object
      properties:
        bootstrap_required: *id001
        providers:
          type: array
          items:
            type: string
            enum:
            - local
            - ldap
            - oidc
        bootstrap_token_file:
          type: string
          description: Private server-side file path, present only before bootstrap; never its contents.
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        schema_version: &id014
          type: integer
        installation_id:
          type: string
        capabilities:
          type: object
          properties:
            authentication: *id001
            registry: *id001
            migration_execution:
              type: boolean
              description: Execution API is implemented; runtime readiness and Oracle verification are separate checks.
    ConnectionInput:
      type: object
      additionalProperties: false
      required: [target, username]
      properties:
        target: {$ref: '#/components/schemas/TargetInput'}
        account_id: {type: string, description: Existing account on this target. Empty creates an account. Allowlist updates affect this account only.}
        username: {type: string}
        password: {type: string, writeOnly: true, maxLength: 4096, description: Required for creation. Empty on edit reuses the encrypted saved credential.}
        timeout_seconds: {type: integer, minimum: 5, maximum: 30, default: 20}
        schemas: {type: array, items: {type: string}, description: Explicit selected schema names. Nonempty on Save; unsupported schemas rejected.}
        acknowledge_unknown: {type: boolean, default: false}
        grant_current_user: {type: boolean, default: false, description: Explicitly grant current user schema-scoped read and operation rights.}
        grant_prod: {type: boolean, default: false, description: Separate explicit PROD authorization; requires grant_current_user on a PROD target.}
    Connection:
      type: object
      required: [target, account, schemas, timeout_seconds]
      properties:
        target: {$ref: '#/components/schemas/Target'}
        account: {$ref: '#/components/schemas/ExecutionAccount'}
        schemas: {type: array, items: {$ref: '#/components/schemas/Schema'}}
        timeout_seconds: {type: integer}
    SchemaCandidate:
      type: object
      required: [name, own, object_count, known_privileges, migration_capability, capability_reason]
      properties:
        name: {type: string}
        own: {type: boolean}
        object_count: {type: integer, description: Count of accessible objects; not necessarily the schema's full object count.}
        known_privileges: {type: array, items: {type: string}}
        migration_capability: {type: string, enum: [potential, unknown, unsupported]}
        capability_reason: {type: string}
    ConnectionDiscovery:
      type: object
      required: [network_state, authentication_state, actual_user, current_schema, database_service, pdb_name, schema_total, schemas, warnings, capabilities]
      properties:
        network_state: {type: string, enum: [verified, failed, unknown]}
        authentication_state: {type: string, enum: [verified, failed, unknown]}
        error_code: {type: string}
        error_message: {type: string}
        actual_user: {type: string}
        current_schema: {type: string}
        database_service: {type: string}
        pdb_name: {type: string}
        own_schema: {type: string}
        schema_total: {type: integer, description: Complete returned count without arbitrary truncation. Warnings explain inaccessible or timed out metadata.}
        schemas: {type: array, items: {$ref: '#/components/schemas/SchemaCandidate'}}
        system_privileges: {type: array, items: {type: string}}
        enabled_roles: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        capabilities:
          type: array
          items:
            type: object
            required: [view, status, detail]
            properties:
              view: {type: string}
              status: {type: string}
              detail: {type: string}
    Target:
      type: object
      properties:
        id: &id007
          type: string
        name: &id008
          type: string
        environment: &id009
          type: string
          enum:
          - DEV
          - UAT
          - PROD
        host: &id010
          type: string
        port: &id011
          type: integer
          minimum: 1
          maximum: 65535
        service: &id012
          type: string
        transport: &id013
          type: string
          enum:
          - TCP
          - TCPS
        active: *id001
        created_at: *id006
    TargetInput:
      type: object
      properties:
        id: *id007
        name: *id008
        environment: *id009
        host: *id010
        port: *id011
        service: *id012
        transport: *id013
        active: *id001
      required:
      - name
      - environment
      - host
      - port
      - service
      - transport
    Schema:
      type: object
      properties:
        id:
          type: string
        target_id:
          type: string
        name:
          type: string
        history_schema:
          type: string
        history_table:
          type: string
        default_account_id:
          type: string
        active: *id001
        created_at: *id006
    SchemaInput:
      type: object
      properties:
        name:
          type: string
        history_schema:
          type: string
          description: Defaults to target schema name.
        history_table:
          type: string
          default: flyway_schema_history
        default_account_id:
          type: string
          description: Empty clears the default; nonempty must be explicitly mapped and active.
        active: *id001
      required:
      - name
    CredentialMetadata:
      type: object
      properties:
        configured: *id001
        version: *id014
        updated_at: &id015
          anyOf:
          - *id006
          - const: ''
        revoked: *id001
    ExecutionAccount:
      type: object
      properties:
        id:
          type: string
        target_id:
          type: string
        name:
          type: string
        username:
          type: string
        active: *id001
        schema_ids:
          type: array
          items:
            type: string
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        created_at: *id006
    AccountInput:
      type: object
      properties:
        target_id:
          type: string
        name:
          type: string
        username:
          type: string
        active: *id001
        schema_ids:
          type: array
          items:
            type: string
        password:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Optional on creation; use credential endpoint for replacement.
      required:
      - name
      - username
      - schema_ids
    ServiceAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        owner_id:
          type: string
        purpose:
          type: string
        active: *id001
        created_at: *id006
    ServiceInput:
      type: object
      properties:
        name:
          type: string
        owner_id:
          type: string
        purpose:
          type: string
        active: *id001
      required:
      - name
      - owner_id
      - purpose
    Token:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        created_at: *id006
        expires_at: *id006
        last_used_at: *id015
        revoked: *id001
    TokenInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        expires_at: *id006
      required:
      - expires_at
    IssuedToken:
      type: object
      properties:
        token:
          type: string
          description: One-time plaintext; cannot be retrieved again.
        metadata:
          $ref: '#/components/schemas/Token'
    LDAPSettings:
      type: object
      properties:
        enabled: *id001
        url:
          type: string
        start_tls: *id001
        base_dn:
          type: string
        bind_dn_template:
          type: string
          description: Contains {username}; escaped before direct user bind.
        subject_attribute:
          type: string
        username_attribute:
          type: string
          default: uid
        display_name_attribute:
          type: string
          default: displayName
        ca_file:
          type: string
    OIDCSettings:
      type: object
      properties:
        enabled: *id001
        issuer: &id016
          type: string
        client_id: &id017
          type: string
        redirect_url: &id018
          type: string
        ca_file: &id019
          type: string
        client_secret_configured: *id001
    OIDCInput:
      type: object
      properties:
        enabled: *id001
        issuer: *id016
        client_id: *id017
        redirect_url: *id018
        ca_file: *id019
        client_secret_configured: *id001
        client_secret:
          type: string
          writeOnly: true
          description: Empty/omitted preserves the existing encrypted secret.
    AuthSettings:
      type: object
      properties:
        local_enabled: *id001
        ldap:
          $ref: '#/components/schemas/LDAPSettings'
        oidc:
          $ref: '#/components/schemas/OIDCSettings'
    AuthSettingsInput:
      type: object
      properties:
        local_enabled: *id001
        ldap:
          $ref: '#/components/schemas/LDAPSettings'
        oidc:
          $ref: '#/components/schemas/OIDCInput'
      required:
      - local_enabled
      - ldap
      - oidc
    AuditEvent:
      type: object
      properties:
        id: *id014
        actor_id:
          type: string
        actor_type:
          type: string
        actor_name:
          type: string
        action:
          type: string
        target:
          type: string
        timestamp: *id006
        outcome:
          type: string
        request_id:
          type: string
    RuntimeReadiness:
      type: object
      properties:
        ready:
          type: boolean
        version:
          type: string
        integrity:
          type: string
        dependency:
          type: string
        blockers:
          type: array
          items: {type: string}
      required: [ready, version, integrity, dependency, blockers]
    RunContext:
      type: object
      additionalProperties: false
      properties:
        external_run_id: {type: string, maxLength: 500}
        commit_sha: {type: string, maxLength: 200}
        initiated_by: {type: string, maxLength: 500}
    RunInput:
      type: object
      additionalProperties: false
      properties:
        target_id: {type: string}
        schema_id: {type: string}
        execution_account_id: {type: string}
        artifact_id: {type: string}
        context: {$ref: '#/components/schemas/RunContext'}
      required: [target_id, schema_id, execution_account_id, artifact_id]
    AccountSnapshot:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        username: {type: string}
        credential_version: {type: integer}
      required: [id, name, username, credential_version]
    ArtifactFile:
      type: object
      properties:
        path: {type: string}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        kind: {type: string, enum: [versioned, repeatable]}
        version: {type: string}
        size: {type: integer, minimum: 0}
      required: [path, sha256, kind, version, size]
    ArtifactInput:
      type: object
      properties:
        name: {type: string}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        size: {type: integer, minimum: 0}
      required: [name, sha256, size]
    Artifact:
      type: object
      properties:
        id: {type: string}
        target_id: {type: string}
        schema_id: {type: string}
        uploader_id: {type: string}
        uploader_kind: {type: string}
        uploader_name: {type: string}
        created_at: {$ref: '#/components/schemas/DateTime'}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        total_bytes: {type: integer, minimum: 0}
        files:
          type: array
          items: {$ref: '#/components/schemas/ArtifactFile'}
        inputs:
          type: array
          items: {$ref: '#/components/schemas/ArtifactInput'}
      required: [id, target_id, schema_id, uploader_id, uploader_kind, uploader_name, created_at, sha256, total_bytes, files, inputs]
    Blocker:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
      required: [code, message]
    Diagnostic:
      type: object
      properties:
        name: {type: string}
        status: {type: string}
        detail: {type: string}
      required: [name, status, detail]
    Preflight:
      type: object
      properties:
        ready: {type: boolean}
        local_ready: {type: boolean}
        live_status: {type: string, enum: [VERIFIED, NOT_VERIFIED, FAILED]}
        blockers:
          type: array
          items: {$ref: '#/components/schemas/Blocker'}
        warnings:
          type: array
          items: {type: string}
        runtime_version: {type: string}
        files:
          type: array
          items: {$ref: '#/components/schemas/ArtifactFile'}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
        info: {}
        validation: {}
      required: [ready, local_ready, live_status, blockers, warnings, runtime_version, files, diagnostics]
    Run:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        artifact_name: {type: string}
        flyway_configuration:
          type: object
          additionalProperties: {type: string}
        status_url: {type: string}
        logs_url: {type: string}
        status: {type: string, enum: [QUEUED, PREFLIGHT, RUNNING, REPAIRING, SUCCEEDED, FAILED, BLOCKED, NEEDS_REVIEW, CANCELLED]}
        target_id: {type: string}
        schema_id: {type: string}
        execution_account_id: {type: string}
        artifact_id: {type: string}
        context: {$ref: '#/components/schemas/RunContext'}
        target: {$ref: '#/components/schemas/Target'}
        schema: {$ref: '#/components/schemas/Schema'}
        account: {$ref: '#/components/schemas/AccountSnapshot'}
        actor_id: {type: string}
        actor_kind: {type: string}
        actor_name: {type: string}
        source: {type: string, enum: [WEB, API]}
        created_at: {$ref: '#/components/schemas/DateTime'}
        started_at: {$ref: '#/components/schemas/DateTimeOrEmpty'}
        finished_at: {$ref: '#/components/schemas/DateTimeOrEmpty'}
        flyway_version: {type: string}
        exit_code:
          anyOf:
          - {type: integer}
          - {type: 'null'}
        migration_outcome: {type: string}
        repair_outcome: {type: string}
        reason: {type: string}
        preflight: {$ref: '#/components/schemas/Preflight'}
      required: [id, run_id, status_url, logs_url, status, target_id, schema_id, execution_account_id, artifact_id, context, target, schema, account, actor_id, actor_kind, actor_name, source, created_at, started_at, finished_at, flyway_version, exit_code, migration_outcome, repair_outcome, reason]
    RunLog:
      type: object
      properties:
        sequence: {type: integer, format: int64}
        command: {type: string}
        channel: {type: string}
        message: {type: string}
        created_at: {$ref: '#/components/schemas/DateTime'}
      required: [sequence, command, channel, message, created_at]
    RunExecution:
      type: object
      properties:
        id: {type: string}
        command: {type: string}
        success: {type: boolean}
        exit_code: {type: integer}
        stdout: {type: string}
        stderr: {type: string}
        json: {}
        started_at: {$ref: '#/components/schemas/DateTime'}
        finished_at: {$ref: '#/components/schemas/DateTime'}
        ambiguous: {type: boolean}
      required: [id, command, success, exit_code, stdout, stderr, started_at, finished_at, ambiguous]
    Repair:
      type: object
      properties:
        outcome: {type: string, enum: [SUCCEEDED, FAILED, SKIPPED, UNSAFE]}
        reason: {type: string}
        before: {}
        after: {}
        execution_id: {type: string}
      required: [outcome, reason, before, after, execution_id]
    RunRecord:
      type: object
      properties:
        run: {$ref: '#/components/schemas/Run'}
        logs:
          type: array
          items: {$ref: '#/components/schemas/RunLog'}
        executions:
          type: array
          items: {$ref: '#/components/schemas/RunExecution'}
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/Artifact'}
        repair: {$ref: '#/components/schemas/Repair'}
      required: [run, logs, executions, artifacts, repair]
    Ok:
      type: object
      properties:
        ok: {type: boolean, const: true}
      required: [ok]
    DateTime:
      type: string
      format: date-time
    DateTimeOrEmpty:
      anyOf:
      - {$ref: '#/components/schemas/DateTime'}
      - {type: string, const: ''}
  responses:
    Error:
      description: Typed API error with safe message and optional field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
