        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      summary: Register Oracle target
      operationId: post_database_targets
      description: Stable identities/natural keys reject duplicate submission with 409. New records are active.
