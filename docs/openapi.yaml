openapi: 3.1.0
info:
  title: Flyway Manager API
  version: 0.4.0
  description: Standalone identity, Oracle registry, immutable artifacts and controlled asynchronous Flyway execution. All JSON successes use {data:...}; errors use {error:{code,message,field?}}.
    JSON mutation bodies are limited to 1 MiB and unknown fields are rejected. Browser mutations require same Origin
    plus per-session CSRF, except first-run/login require Origin plus their credentials. Bearer tokens never create
    web sessions and cannot access administration. Lists with limit/offset are filtered by authorization before
    pagination; ordering is stable. Clock values are UTC RFC3339. Sessions expire after 12 hours or 30 minutes idle;
    account/role changes and password changes revoke sessions. Unknown routes return JSON 404; unsupported methods
    405.
servers:
- url: /api/v1
security:
- Session: []
- Bearer: []
paths:
  /health:
    get:
      summary: Public SQLite health and explicit capability flags
      operationId: get_health
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
  /system:
    get:
      summary: Authenticated system capability flags
      operationId: get_system
      security:
      - Session: []
      - Bearer: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      capabilities:
                        type: object
                        properties: {}
                      installation_id:
                        type: string
                      schema_version:
                        type: integer
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /auth/status:
    get:
      summary: Enabled providers and one-time setup status
      operationId: get_auth_status
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthStatus'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
  /auth/bootstrap:
    post:
      summary: Create initial local Admin and session atomically
      operationId: post_auth_bootstrap
      description: Requires the private bootstrap.token file contents. Concurrent/repeated successful setup is prevented
        transactionally.
      security: []
      parameters:
      - name: Origin
        in: header
        required: false
        description: Required matching browser origin for cookie mutations, login and bootstrap. Bearer-only API
          requests are exempt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                display_name:
                  type: string
                password:
                  type: string
                  minLength: 12
                  maxLength: 1024
                  writeOnly: true
                setup_token:
                  type: string
                  writeOnly: true
              required:
              - username
              - password
              - setup_token
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      summary: Authenticate explicitly with Local or LDAP
      operationId: post_auth_login
      description: Generic invalid-credential errors. No provider fallback. Sets HttpOnly SameSite=Lax fm_session
        cookie, Secure on HTTPS/configured HTTPS public URL. Rate limited by address and username.
      security: []
      parameters:
      - name: Origin
        in: header
        required: false
        description: Required matching browser origin for cookie mutations, login and bootstrap. Bearer-only API
          requests are exempt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                  - local
                  - ldap
                username:
                  type: string
                password:
                  type: string
                  writeOnly: true
              required:
              - provider
              - username
              - password
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/oidc/start:
    get:
      summary: Begin browser-bound OIDC code flow with PKCE
      operationId: get_auth_oidc_start
      security: []
      responses:
        '302':
          description: Success.
          headers:
            Location:
              schema:
                type: string
              description: Provider authorization URL or same-site /runs after success.
        default:
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/oidc/callback:
    get:
      summary: Consume single-use state and verify OIDC callback
      operationId: get_auth_oidc_callback
      security: []
      responses:
        '302':
          description: Success.
          headers:
            Location:
              schema:
                type: string
              description: Provider authorization URL or same-site /runs after success.
        default:
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      parameters:
      - name: state
        in: query
        schema:
          type: string
      - name: code
        in: query
        schema:
          type: string
      - name: error
        in: query
        schema:
          type: string
  /auth/me:
