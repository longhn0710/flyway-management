          type: string
        schema_id:
          type: string
          description: Omit for an instance scope. Membership never grants access.
    ProjectInput:
      type: object
      additionalProperties: false
      required:
      - name
      - members
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
          - active
          - archived
        members:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ProjectMember'
    Project:
      allOf:
      - $ref: '#/components/schemas/ProjectInput'
      - type: object
        required:
        - id
        - created_at
        - updated_at
        properties:
          id:
            type: string
            description: Stable immutable identifier
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
    NativeFlywayInfo:
      type:
      - object
      - 'null'
      additionalProperties: true
      properties:
        schemaVersion: {}
        flywayVersion:
          type: string
        migrations:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              category:
                type:
                - string
                - 'null'
              version:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
              type:
                type:
                - string
                - 'null'
              installedOnUTC:
                type:
                - string
                - 'null'
              installedBy:
                type:
                - string
                - 'null'
              state:
                type:
                - string
                - 'null'
              filepath:
                type:
                - string
                - 'null'
    InfoCapture:
      type: object
      properties:
        id:
          type: string
        target_id:
          type: string
        schema_id:
          type: string
        source_run_id:
          type: string
        source:
          type: string
        captured_at:
          type: string
        started_at:
          type: string
        artifact_id:
          type: string
        artifact_sha256:
          type: string
        runtime_version:
          type: string
        actor_name:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        success:
          type: boolean
        exit_code:
          type: integer
        json:
          $ref: '#/components/schemas/NativeFlywayInfo'
        warnings:
          type: array
          items:
            type: string
        snapshot:
          type: object
          description: Immutable destination, history configuration and historical account identity; no secrets.
          additionalProperties: true
        files:
          type: array
          items:
            type: object
            additionalProperties: true
  responses:
    ExternalProblem:
      description: Problem response. 400 malformed request; 401 invalid/missing token; 403 action denied; 404 absent/inaccessible/nesting
        mismatch; 409 stale revision, held stream, blocked/expired preflight or idempotency conflict; 412 stale If-Match; 413
        size limit; 415 non-ZIP/media type; 422 invalid package/checksum; 428 missing If-Match; 429 upload capacity; 503 runtime
        unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ExternalProblem'
    Error:
      description: Typed API error with safe message and optional field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
