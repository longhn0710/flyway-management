        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      summary: Revoke current session and expire cookie
      operationId: post_auth_logout
      security:
      - Session: []
        CSRF: []
      parameters:
      - name: Origin
        in: header
        required: false
