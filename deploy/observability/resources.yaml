apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyway-manager-observability
  namespace: flyway-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flyway-manager-observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flyway-manager-observability
        app.kubernetes.io/part-of: flyway-manager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
          args: [--config=/etc/otel/collector.yaml]
          env:
            - name: ELASTIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flyway-manager-elastic-api-key
                  key: api-key
          ports:
            - name: otlp-https
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: otlp-https
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            - name: tls
              mountPath: /run/collector-tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: flyway-manager-observability
        - name: tls
          secret:
            secretName: flyway-manager-observability-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: flyway-manager-observability
  namespace: flyway-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flyway-manager-observability
  ports:
    - name: otlp-https
      port: 4318
      targetPort: otlp-https
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flyway-manager-observability-isolation
  namespace: flyway-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flyway-manager-observability
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flyway-manager
              app.kubernetes.io/instance: flyway-manager
      ports:
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flyway-manager-observability-egress
  namespace: flyway-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flyway-manager
      app.kubernetes.io/instance: flyway-manager
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flyway-manager-observability
      ports:
        - protocol: TCP
          port: 4318
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flyway-manager-observability-cloud
  namespace: flyway-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flyway-manager-observability
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: my-observability-project-d9be29.ingest.asia-southeast1.gcp.elastic.cloud
    - toFQDNs:
        - matchName: my-observability-project-d9be29.ingest.asia-southeast1.gcp.elastic.cloud
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
